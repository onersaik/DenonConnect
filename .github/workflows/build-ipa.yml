name: Build iPad IPA

# Compila el proyecto de iOS y genera el .ipa firmado en un runner macOS de
# GitHub, para no depender del Xcode local (que en este Mac solo tenía las
# Command Line Tools activas, sin capacidad de archivar para iOS).
#
# Necesita 5 secrets en el repo (Settings -> Secrets and variables -> Actions):
#
#   IOS_DIST_SIGNING_CERT_P12_BASE64   Certificado de firma (.p12) en base64
#   IOS_DIST_SIGNING_CERT_PASSWORD     Contraseña con la que exportaste el .p12
#   IOS_PROVISION_PROFILE_BASE64       Provisioning profile (.mobileprovision) en base64
#   KEYCHAIN_PASSWORD                  Cualquier contraseña, solo para el keychain temporal del runner
#   APPLE_TEAM_ID                      Tu Team ID de Apple Developer (10 caracteres)
#
# Como generarlos, desde tu Mac:
#
#   1. Certificado (.p12):
#      Keychain Access -> busca tu certificado "Apple Development" o
#      "Apple Distribution" (el que tenga la llave privada al lado) ->
#      clic derecho -> Exportar -> formato .p12 -> pon una contraseña.
#      base64 -i certificado.p12 | pbcopy
#      Pega el resultado en el secret IOS_DIST_SIGNING_CERT_P12_BASE64.
#      La contraseña que usaste va en IOS_DIST_SIGNING_CERT_PASSWORD.
#
#   2. Provisioning profile:
#      developer.apple.com -> Certificates, IDs & Profiles -> Profiles ->
#      crea uno de tipo "iOS App Development" (o "Ad Hoc") para el App ID
#      com.entikrecords.stageconnect.ipad, con tu iPad registrado como
#      dispositivo de prueba. Descárgalo y:
#      base64 -i perfil.mobileprovision | pbcopy
#      Pega el resultado en IOS_PROVISION_PROFILE_BASE64.
#
#   3. KEYCHAIN_PASSWORD: cualquier cadena, p.ej. genera una con
#      openssl rand -base64 24
#
#   4. APPLE_TEAM_ID: developer.apple.com -> Membership -> Team ID,
#      o en tu Mac: security find-identity -v -p codesigning
#
# Sin esos secrets el workflow falla en el paso de importar el certificado
# (fallo claro y explicado en el log, no un IPA sin firmar silencioso).

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - "iOS/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    name: xcodebuild archive + export (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Comprobar que los secrets de firma existen
        run: |
          faltan=""
          [ -z "${{ secrets.IOS_DIST_SIGNING_CERT_P12_BASE64 }}" ] && faltan="$faltan IOS_DIST_SIGNING_CERT_P12_BASE64"
          [ -z "${{ secrets.IOS_DIST_SIGNING_CERT_PASSWORD }}" ]  && faltan="$faltan IOS_DIST_SIGNING_CERT_PASSWORD"
          [ -z "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" ]    && faltan="$faltan IOS_PROVISION_PROFILE_BASE64"
          [ -z "${{ secrets.KEYCHAIN_PASSWORD }}" ]               && faltan="$faltan KEYCHAIN_PASSWORD"
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ]                   && faltan="$faltan APPLE_TEAM_ID"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secrets en el repo (Settings -> Secrets and variables -> Actions):"
            echo "$faltan"
            echo "Mira los comentarios al principio de este workflow (.github/workflows/build-ipa.yml) para saber como generarlos."
            exit 1
          fi

      - name: Importar certificado y provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Perfil: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Archivar
        run: |
          set -e
          xcodebuild archive \
            -project "iOS/STAGE CONNECT.xcodeproj" \
            -scheme "STAGE CONNECT" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/STAGECONNECT.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            | xcpretty --simple || true

      - name: Exportar IPA
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.entikrecords.stageconnect.ipad</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/STAGECONNECT.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Subir el IPA como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: STAGE-CONNECT-iPad-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
