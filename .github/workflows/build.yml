name: Build & Test (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: swift build (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version 2>&1 | tee /tmp/build.log

      - name: Build (debug)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          swift build 2>&1 | tee -a /tmp/build.log

      - name: Build (release)
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== RELEASE ===" >> /tmp/build.log
          swift build -c release 2>&1 | tee -a /tmp/build.log

      - name: Empaquetar SC6000 Connect.app
        id: package
        if: steps.release.outcome == 'success'
        run: |
          set -e
          BIN_PATH="$(swift build -c release --show-bin-path)"
          APP="STAGE CONNECT.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_PATH/SC6000ConnectApp" "$APP/Contents/MacOS/SC6000ConnectApp"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          chmod +x "$APP/Contents/MacOS/SC6000ConnectApp"
          # Firma ad-hoc: no evita el aviso de Gatekeeper, pero deja el bundle
          # consistente y estable frente a las comprobaciones de macOS.
          codesign --force --deep --sign - "$APP" || echo "firma ad-hoc no disponible"
          ditto -c -k --keepParent "$APP" STAGECONNECT.zip
          ls -la STAGECONNECT.zip

      - name: Subir la app como artefacto descargable
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: STAGE-CONNECT-app
          path: STAGECONNECT.zip
          retention-days: 30

      # Publica el log en el propio repositorio para poder leerlo sin iniciar
      # sesión (los logs de Actions están detrás de login). [skip ci] evita
      # que este commit dispare otra ejecución.
      - name: Publicar log de compilación
        if: always()
        run: |
          mkdir -p ci
          cp /tmp/build.log ci/build-log.txt 2>/dev/null || echo "sin log" > ci/build-log.txt
          echo "" >> ci/build-log.txt
          echo "=== resultado: build=${{ steps.build.outcome }} release=${{ steps.release.outcome }} sha=${GITHUB_SHA} ===" >> ci/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci/build-log.txt
          git commit -m "CI: log de compilación [skip ci]" || echo "sin cambios que commitear"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "no se pudo publicar el log"

      - name: Marcar fallo si la compilación falló
        if: steps.build.outcome == 'failure'
        run: |
          echo "La compilación en modo debug falló. Ver ci/build-log.txt en el repositorio."
          exit 1
